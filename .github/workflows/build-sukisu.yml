# ============================================================
# ReSukiSU + SUSFS (隐藏 SELinux) 内核构建 — Realme Q5 / 9 5G (oscar, RMX3478)
# 平台: SM6375 (holi) | 内核: 5.4 QGKI | LineageOS 23.2
#
# 用法:
#   1. 在 GitHub 新建仓库，把本文件放到 .github/workflows/ 下并 push
#      (patches/50_add_susfs_in_kernel-5.4.patch 必须一起推)
#   2. Actions 页面 → Build SukiSU Kernel for oscar → Run workflow
#      (los_date 填你手机当前系统 nightly 的日期，必须一致！)
#   3. 构建完成(约 40-90 分钟)后下载 artifact: new_boot.img
#   4. fastboot 双槽刷入 (见 README.md)
#
# 缓存策略 (Actions 页面 → Cache 可查看，GitHub 自动淘汰旧条目):
#   - clang 工具链 / 内核源码: 固定 key，首次下载后永久复用
#   - boot.img (nightly): 按 los_date 缓存，同日期只下载一次
#   - ccache 编译缓存: 每次成功构建后更新，二次构建大幅提速
# ============================================================
name: Build SukiSU Kernel for oscar

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支 (默认 lineage-23.2，对应你刷的 LineageOS 23.2)'
        required: true
        type: string
        default: 'lineage-23.2'
      los_version:
        description: 'LineageOS 版本 (用于 nightly 下载链接)'
        required: true
        type: string
        default: '23.2'
      los_date:
        description: 'LineageOS nightly 日期 YYYYMMDD (必须与你手机当前系统一致!)'
        required: true
        type: string
        default: '20260817'
      custom_version:
        description: '自定义版本名 (可选，显示在 uname -r)'
        required: false
        type: string
        default: ''

env:
  DEVICE: 'oscar'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ============ 0. 检出本仓库 (含 patches/ 下的 SUSFS patch) ============
      - name: 检出仓库
        uses: actions/checkout@v4

      # ============ 1. 内核源码 (缓存) ============
      - name: 恢复内核源码缓存
        id: cache-kernel
        uses: actions/cache/restore@v6
        with:
          path: kernel
          key: kernel-oscar-${{ github.event.inputs.kernel_branch }}

      - name: 下载 oscar 内核源码 (LineageOS)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/LineageOS/android_kernel_realme_sm6375 kernel
          echo "内核分支: ${{ github.event.inputs.kernel_branch }}"
          ls kernel/arch/arm64/configs/vendor/ | grep holi

      - name: 保存内核源码缓存
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: kernel
          key: kernel-oscar-${{ github.event.inputs.kernel_branch }}

      # ★ 内核 commit 对齐已刷系统 (2026-10-11 设备实证):
      #   主设备 RE547D (RMX3478) 运行 LineageOS 23.2 nightly-20261005-oscar,
      #   内核 = 5.4.302-qgki-g84e7d691ee3a。git ls-remote 实证 LineageOS
      #   android_kernel_realme_sm6375 的 lineage-23.2 分支 tip 就是
      #   84e7d691ee3a094de68628c488847a4dd632e7eb (= g84e7d691ee3a) ——
      #   与已刷系统完全一致。若缓存恢复的是更早 commit, 这里 fetch+强制
      #   checkout 保证源码与已刷系统同版 (避免内核与 vendor 模块二进制不匹配)。
      - name: 锁定内核 commit 与已刷系统同版 (g84e7d691ee3a)
        run: |
          cd kernel
          if ! git cat-file -e 84e7d691ee3a094de68628c488847a4dd632e7eb^{commit} 2>/dev/null; then
            git fetch --depth 1 origin "${{ github.event.inputs.kernel_branch }}"
          fi
          git checkout -f 84e7d691ee3a094de68628c488847a4dd632e7eb
          echo "内核 commit 已锁定: $(git rev-parse --short HEAD)"
          ls arch/arm64/configs/vendor/ | grep holi

      # ============ 2. 编译依赖 ============
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc flex bison bc cpio lz4 xz-utils \
            libssl-dev libncurses-dev libelf-dev device-tree-compiler \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu ccache zip unzip

      # ============ 3. AOSP Clang (缓存) ============
      - name: 恢复 AOSP Clang 缓存
        id: cache-clang
        uses: actions/cache/restore@v6
        with:
          path: clang
          key: clang-oscar-r510928-v2

      - name: 下载 AOSP Clang (锁定含 clang-r510928 的历史 commit, blob:none 部分克隆)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          # 只下载需要的 clang 版本目录 (~1.5GB)。
          # ★ 2026-10 修复:
          #   1) googlesource master 已移除 clang-r510928 目录 (README 仍写死该版本,
          #      直接 sparse-checkout 会得到空目录 → clang: command not found)。
          #      因此必须从 master 历史里找到删除前的 commit 并 checkout (路线 A)。
          #   2) 不能用纯 --sparse 克隆: 那会下载整棵树所有 blob (几十 GB) 超时。
          #      必须保留 --filter=blob:none 部分克隆, 仅按需拉取 clang-r510928 的 blob。
          #   3) googlesource 默认分支是 main-kernel (同样已删除 r510928), 历史在
          #      master 分支 —— 逐步加深 master 深度直到路径历史出现 clang-r510928。
          git clone --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang || exit 1
          cd clang
          # 逐步加深 master 历史, 直到 git log 能列出 clang-r510928 的路径历史
          DEPTH=1000
          MAX_DEPTH=100000
          DEST=""
          while [ -z "$DEST" ]; do
            echo ">> git fetch --depth $DEPTH origin master"
            git fetch --depth "$DEPTH" origin master || exit 1
            DEST=$(git log --format=%H FETCH_HEAD -- clang-r510928 2>/dev/null | head -1)
            if [ -z "$DEST" ]; then
              [ "$DEPTH" -ge "$MAX_DEPTH" ] && { echo "!! 最大深度 $MAX_DEPTH 仍未找到含 clang-r510928 的 commit, 中止"; exit 1; }
              DEPTH=$((DEPTH * 2))
            fi
          done
          echo "clang-r510928 路径历史最新 commit: $DEST ($(git log -1 --format=%s "$DEST"))"
          # 该 commit 是"删除 clang-r510928"的 commit, 检出其父 commit (仍含该目录)
          # 保险起见: 若 DEST 本身就含目录则直接用, 否则逐级回退找最近的含目录 commit
          TARGET=$DEST
          while ! git cat-file -e "$TARGET:clang-r510928" 2>/dev/null; do
            TARGET=$(git rev-parse "$TARGET^") || exit 1
          done
          echo "checkout 目标 commit: $TARGET ($(git log -1 --format=%s "$TARGET"))"
          git checkout -q "$TARGET"
          git sparse-checkout set clang-r510928
          # 任何失败都不能留下坏目录进缓存
          if [ ! -x clang-r510928/bin/clang ]; then
            echo "!! clang 下载失败/不完整, 中止 (防止缓存坏目录)"
            exit 1
          fi
          clang-r510928/bin/clang --version | head -1
          # 诊断: 确认链接器情况
          ls clang-r510928/bin/ | grep -E "^(clang|ld|lld)" | head
          # 兜底: 安装系统 lld (提供 /usr/bin/ld.lld)
          sudo apt-get install -y lld || true

      - name: 保存 AOSP Clang 缓存
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: clang
          key: clang-oscar-r510928-v2

      # ============ 4. ReSukiSU 集成 (锁定 v4.1.0 + symlink) ============
      # ReSukiSU = SukiSU-Ultra 的独立重构 fork (GPL-3.0)。
      # Kbuild 强制要求 KernelSU 目录是 git 仓库 (rev-list 计数版本号) +
      # 内核树根有 .git —— 因此 ReSukiSU 必须完整 clone (不能 --depth 1,
      # 否则 Kbuild 会触发 git fetch --unshallow 拖慢构建)。
      # ★ 锁定 v4.1.0: ReSukiSU 最新 main 已重构为 BakaSU (v4.2.0-rc*),
      #   其 kernel/tools/susfs_compat.mk 会校验 SUSFS 内核侧版本并拒绝旧版
      #   —— 仓库自带的 SUSFS v2.2.0 (08-18) 5.4 移植 patch 无法通过, 编译中止。
      #   v4.1.0 无此检查, 与仓库 SUSFS patch 兼容 (结构验证: kernel/ 目录)。
      # 集成: clone 到 KernelSU + symlink drivers/kernelsu → KernelSU/kernel。
      - name: 集成 ReSukiSU (锁定 v4.1.0 + symlink)
        run: |
          cd kernel
          # 缓存恢复后 KernelSU 可能已存在，先删再 clone (全量, 不要 --depth 1)
          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          cd KernelSU
          git checkout v4.1.0
          echo "ReSukiSU commit: $(git log --oneline -1)"
          ls kernel/Kbuild kernel/Kconfig kernel/selinux/selinux.c && echo "结构正确 (kernel/ 目录)"
          cd ..
          # 手动集成 (等价官方 manual-integrate 教程)
          ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "--- 检查 ReSukiSU 源码是否集成 ---"
          ls -la drivers/kernelsu/ | head -8
          grep -n "kernelsu" drivers/Makefile

      # ============ 4.45 ReSukiSU 5.4 (sm6375) API 兼容修复 ============
      # Run#5 失败: clang18 编译 drivers/kernelsu 时报错 (ReSukiSU v4.1.0):
      #   allowlist.c:427 'TWA_RESUME' undeclared
      #   allowlist.c:430 'put_task_struct' implicit declaration
      # 根因: LineageOS sm6375 (SM6375) 的 5.4 内核把 task_work_add 的第三参数
      #   从上游 enum task_work_notify_t (TWA_NONE/TWA_RESUME/TWA_SIGNAL) 改成了
      #   plain bool —— 高通裁剪版内核 task_work.h 无 TWA_* 枚举, 因此 v4.1.0
      #   (按上游 API 编写) 编译失败。put_task_struct 声明在
      #   include/linux/sched/task.h, 而 sm6375 的 sched.h 不包含它, 需显式 include。
      # 修复: 全部 drivers/kernelsu/*.c 里 task_work_add(..., TWA_RESUME) ->
      #   task_work_add(..., true) (bool 参数, true 语义等价 TWA_RESUME);
      #   用到 put_task_struct 的文件统一补 #include <linux/sched/task.h>。
      # 实测确认 (2026-10): sm6375 include/linux/task_work.h:
      #   int task_work_add(struct task_struct *, struct callback_head *, bool);
      #   grep TWA_ include/ 无任何枚举定义。
      - name: 修复 ReSukiSU 的 5.4 (sm6375) task_work API 兼容
        run: |
          cd kernel
          # 4.45.0) KSU_VERSION 兜底: ReSukiSU/ReSukiSU 仓库没有 miuix 本地分支,
          #   KernelSU/kernel/Kbuild 里 $(git rev-list --count miuix) 为空
          #   -> KSU_VERSION 空 -> ccflags '-DKSU_VERSION=' 空宏 ->
          #   supercalls.c:91 '{.version = KERNEL_SU_VERSION, .flags = 0}'
          #   展开成 '{.version = , .flags = 0}' 报 "expected expression"。
          #   (实际报错: Run#9 '-- SukiSU-Ultra version (local .git): ' 为空)
          # 修复 a: 补建 miuix 本地分支指向 HEAD, 让 rev-list 有真实 commit 数;
          # 修复 b: (见下方 python) Kbuild 的 KSU_VERSION 计算加 || echo 13000 兜底。
          if ! git -C KernelSU rev-parse --verify --quiet miuix >/dev/null; then
            git -C KernelSU branch miuix HEAD
          fi
          echo "miuix 分支 commit 数: $(git -C KernelSU rev-list --count miuix)"
          python3 - <<'PYEOF'
          import glob, re
          # 直接用真实路径 (drivers/kernelsu 是指向 KernelSU/kernel 的 symlink)
          files = glob.glob('KernelSU/kernel/*.c') + glob.glob('KernelSU/kernel/selinux/*.c')
          for f in files:
              s = open(f, encoding='utf-8').read()
              orig = s
              # 1) task_work_add 第三参数: TWA_RESUME (上游枚举) -> true (sm6375 bool)
              s = s.replace('TWA_RESUME', 'true')
              # 1.5) put_seccomp_filter: 上游 5.4 存在, 但 sm6375 (高通) 已删除
              #      (仅保留 __put_seccomp_filter static + 公开 seccomp_filter_release),
              #      app_profile.c disable_seccomp_for_task 的 <5.10 分支调用它 ->
              #      隐式声明错误。改为与 >=5.10 分支相同的 seccomp_filter_release()
              #      (sm6375 5.4 存在, 语义一致: 置 filter=NULL 并释放引用)。
              #      实测 sm6375: kernel/seccomp.c 只有 'static void __put_seccomp_filter',
              #      include/linux/seccomp.h 只有 seccomp_filter_release/get_seccomp_filter。
              s = s.replace('put_seccomp_filter(tsk);', 'seccomp_filter_release(tsk);')
              # 1.7) linux/pgtable.h: 5.10+ 才引入的头文件, sm6375 5.4 不存在 ->
              #      sucompat.c  fatal error 'linux/pgtable.h' file not found。
              #     该文件只 include 未用任何 pgtable API (grep 确认只有第 5 行),
              #     且同时 include 了 <linux/mm.h> (5.4 中已含 asm/pgtable.h),
              #     直接删除此 include 即可 (含换行, 避免空行堆积)。
              s = s.replace('#include <linux/pgtable.h>\n', '')
              # 1.9) pkg_observer.c: KernelSU v4.1.0 用 5.10+ 的 fsnotify API
              #      (fsnotify_ops.handle_inode_event), 但 sm6375 是高通 5.4,
              #      回调接口只有 handle_event (8 参数, 上游 6.0 前的经典 fsnotify)。
              #      实测 sm6375 include/linux/fsnotify_backend.h (2026-10):
              #        int (*handle_event)(fsnotify_group*, inode*, u32 mask,
              #                            const void *data, int data_type,
              #                            const qstr *file_name, u32 cookie,
              #                            fsnotify_iter_info*);
              #        fsnotify_alloc_group 只有 1 参 (pkg_observer.c 已有 6.0 分支, 不用改)
              #      函数体只用到 file_name/mask, 不含 mark/dir/iter_info, 换签名安全。
              if f.endswith('pkg_observer.c'):
                  m = re.search(r'static int ksu_handle_inode_event\([^)]*\)', s, re.S)
                  assert m, 'fsnotify sig not found in pkg_observer.c'
                  new_sig = ('static int ksu_handle_event(struct fsnotify_group *group,\n'
                             '                  struct inode *inode, u32 mask, const void *data,\n'
                             '                  int data_type, const struct qstr *file_name, u32 cookie,\n'
                             '                  struct fsnotify_iter_info *iter_info)')
                  s = s[:m.start()] + new_sig + s[m.end():]
                  s = s.replace('.handle_inode_event = ksu_handle_inode_event,',
                                '.handle_event = ksu_handle_event,')
                  if '.handle_inode_event' in s:
                      raise SystemExit('leftover handle_inode_event')
                  print('patched: pkg_observer.c (fsnotify handle_event 5.4)')
              # 1.95) sepolicy.c: KernelSU v4.1.0 的 add_filename_trans 按 5.9+ 的
              #      SELinux filename_trans 结构编写 (filename_trans_key + stypes ebitmap
              #      + next 链 + compat_filename_trans_count + filenametr_key_params +
              #      4 参 hashtab_insert), 但 oscar (sm6375) 是 5.4 GKI 1.0, 旧式设计:
              #        security/selinux/ss/policydb.h:91  struct filename_trans
              #          { u32 stype; u32 ttype; u16 tclass; const char *name; };
              #        policydb.h:98  struct filename_trans_datum { u32 otype; };
              #      无 filename_trans_key / policydb_filenametr_search / stypes /
              #      compat_filename_trans_count / filenametr_key_params;
              #      hashtab_insert/search 为无 key_params 的 3/2 参版本 (hashtab.h:55/63);
              #      services.c filename_compute_type 依赖 policydb->filename_trans_ttypes
              #      ebitmap 跳查 (policydb.h:268) -> 插入新规则必须同时置位。
              #      因此给整段 5.9+ 函数体加 #if >= 5.9 分叉, #else 提供 5.4 实现。
              if f.endswith('sepolicy.c'):
                  m = re.search(r'    struct filename_trans_key key;\n', s)
                  assert m, 'sepolicy key marker not found'
                  s = (s[:m.start()]
                       + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'
                       + s[m.start():])
                  tail = ('    db->compat_filename_trans_count++;\n'
                          '    return ebitmap_set_bit(&trans->stypes, src->value - 1, 1) == 0;\n')
                  assert tail in s, 'sepolicy tail marker not found'
                  s = s.replace(tail, tail + (
                      '#else\n'
                      '    /* oscar (sm6375) 5.4 GKI 1.0: 旧式 filename_trans (5.8-) */\n'
                      '    struct filename_trans key;\n'
                      '    key.stype = src->value;\n'
                      '    key.ttype = tgt->value;\n'
                      '    key.tclass = cls->value;\n'
                      '    key.name = (char *)o;\n'
                      '\n'
                      '    struct filename_trans_datum *trans =\n'
                      '        hashtab_search(db->filename_trans, &key);\n'
                      '    if (trans) {\n'
                      '        trans->otype = def->value;\n'
                      '    } else {\n'
                      '        trans = (struct filename_trans_datum *)kcalloc(1, sizeof(*trans),\n'
                      '                                   GFP_ATOMIC);\n'
                      '        trans->otype = def->value;\n'
                      '        struct filename_trans *new_key =\n'
                      '            (struct filename_trans *)kzalloc(sizeof(*new_key), GFP_ATOMIC);\n'
                      '        *new_key = key;\n'
                      '        new_key->name = kstrdup(key.name, GFP_ATOMIC);\n'
                      '        hashtab_insert(db->filename_trans, new_key, trans);\n'
                      '        ebitmap_set_bit(&db->filename_trans_ttypes, key.ttype, 1);\n'
                      '    }\n'
                      '    return true;\n'
                      '#endif\n'), 1)
                  print('patched: selinux/sepolicy.c (add_filename_trans 5.4 分叉)')
              # 1.97) rules.c: get_policydb() 用 selinux_state.policy (5.10+ GKI2 的
              #      selinux_policy 抽象), 但 oscar (sm6375) 5.4 的 struct selinux_state
              #      (security/selinux/include/security.h:100-115) 没有 policy 成员,
              #      只有 opaque 的 struct selinux_ss *ss (ss/services.h:26-28 内含
              #      struct policydb policydb), 内核自己也是 &state->ss->policydb 访问
              #      (services.c 十余处)。按 5.10 分叉: >=5.10 保留 GKI2 路径, 否则
              #      用 ss->policydb。
              if f.endswith('rules.c'):
                  marker = ('    struct selinux_policy *policy = selinux_state.policy;\n'
                            '    db = &policy->policydb;\n')
                  assert marker in s, 'rules get_policydb marker not found'
                  s = s.replace(marker, (
                      '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n'
                      '    struct selinux_policy *policy = selinux_state.policy;\n'
                      '    db = &policy->policydb;\n'
                      '#else\n'
                      '    /* oscar (sm6375) 5.4 GKI 1.0: selinux_state 无 policy 成员;\n'
                      '     * policydb 在 struct selinux_ss, 与内核 services.c 同款访问。 */\n'
                      '    db = &selinux_state.ss->policydb;\n'
                      '#endif\n'), 1)
                  print('patched: selinux/rules.c (get_policydb 5.4: ss->policydb)')
              # 2) put_task_struct 在所有用到它的文件里显式 include sched/task.h
              if 'put_task_struct' in s and '#include <linux/sched/task.h>' not in s:
                  # 插到第一个 #include <linux/...> 之后 (保证先于使用点)
                  m = re.search(r'(#include <linux/[^\n]+>)', s)
                  if m:
                      ins = m.group(1) + '\n#include <linux/sched/task.h>'
                      s = s[:m.start()] + ins + s[m.end():]
              if s != orig:
                  open(f, 'w', encoding='utf-8').write(s)
                  print('patched:', f)
          # 4.45.0b) Kbuild 兜底: KSU_VERSION 计算失败(空)时回落 13000 (与上游 fallback 一致),
          #   防止 ccflags '-DKSU_VERSION=' 空宏导致 supercalls.c:91 expected expression。
          kb = 'KernelSU/kernel/Kbuild'
          ks = open(kb, encoding='utf-8').read()
          if '|| echo 13000' not in ks:
              assert 'KSU_VERSION := $(shell expr 40000 + $(KSU_LOCAL_VERSION) - 2815)' in ks, 'Kbuild expr line not found'
              ks = ks.replace(
                  'KSU_VERSION := $(shell expr 40000 + $(KSU_LOCAL_VERSION) - 2815)',
                  'KSU_VERSION := $(shell expr 40000 + $(KSU_LOCAL_VERSION) - 2815 2>/dev/null || echo 13000)')
              open(kb, 'w', encoding='utf-8').write(ks)
              print('patched: KernelSU/kernel/Kbuild (KSU_VERSION fallback 13000)')
          else:
              print('Kbuild KSU_VERSION fallback already present')
          PYEOF
          echo "--- 验证 ---"
          grep -rn "TWA_RESUME" KernelSU/kernel/ | grep -v Binary || echo "OK: 无 TWA_RESUME 残留"
          grep -rn "put_seccomp_filter" KernelSU/kernel/ | grep -v Binary || echo "OK: 无 put_seccomp_filter 残留 (改用 seccomp_filter_release)"
          grep -l "put_task_struct" KernelSU/kernel/*.c | while read f; do grep -q "sched/task.h" "$f" || { echo "!! $f 缺 sched/task.h"; exit 1; }; done
          echo "OK: put_task_struct 文件均已 include sched/task.h"

      # ============ 4.5 应用 SUSFS 5.4 patch (fs/ 层, 隐藏 SELinux 核心) ============
      # 官方 SUSFS 08-18 版 (v2.2.0) 只有 GKI 5.10 patch。oscar 是高通 5.4
      # QGKI —— 本仓库已移植为 5.4 版本 (patches/50_add_susfs_in_kernel-5.4.patch):
      #   - nameidata->state 字段 + ND_STATE_LOOKUP_LAST/OPEN_LAST 机制
      #   - do_last/finish_open_created 的 OPEN_REDIRECT (kern_path 替换)
      #   - exec.c/namei.c/readdir.c/stat.c/read_write.c/open.c 等 20 文件 + 3 新文件
      #   - 已排除 hooks.c/selinuxfs.c (ReSukiSU 自带 selinux_hide)
      # 应用时机必须在 ReSukiSU 集成之后 (fs/susfs.c 由本 patch 提供)。
      - name: 应用 SUSFS 5.4 patch
        run: |
          cd kernel
          patch -p1 < ../patches/50_add_susfs_in_kernel-5.4.patch
          echo "--- 验证 SUSFS 已集成 ---"
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep -n "susfs" fs/Makefile
          grep -c "CONFIG_KSU_SUSFS" fs/namei.c

      # ============ 4.55 注入 path_umount (KernelSU kernel_umount.o 链接依赖) ============
      # Run#12 链接失败: drivers/kernelsu/kernel_umount.o 引用 path_umount 未定义。
      # KernelSU v4.1.0 假定内核自带 path_umount (AOSP GKI), 但 oscar 是高通 QGKI
      # 5.4, fs/namespace.c 已删掉该函数 (kern_unmount 只释放长时引用, 非真卸载)。
      # 参照 KernelSU SUSFS 官方做法 (kernel_patches android 系列 patch):
      #   向 fs/namespace.c 注入 path_umount —— 与同文件的 ksys_umount 同款逻辑
      #   (may_mount/can_umount+do_umount 校验), do_umount 是 namespace.c 内 static,
      #   必须注入到同文件才能调用。释放引用用 dput+mntput_no_expire (不调 path_put,
      #   避免清除 mnt_expiry_mark, 与 ksys_umount 一致); path ref 由调用方
      #   try_umount(kern_path) 获取、由本函数释放。
      - name: 注入 path_umount 到 fs/namespace.c (修复 kernel_umount 链接)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          f = 'fs/namespace.c'
          s = open(f, encoding='utf-8').read()
          marker = 'static bool is_mnt_ns_file(struct dentry *dentry)'
          assert marker in s, 'is_mnt_ns_file marker not found in namespace.c'
          funcs = (
              'int path_umount(struct path *path, int flags)\n'
              '{\n'
              '\tstruct mount *mnt;\n'
              '\tint retval;\n'
              '\n'
              '\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n'
              '\t\treturn -EINVAL;\n'
              '\n'
              '\tif (!may_mount())\n'
              '\t\treturn -EPERM;\n'
              '\n'
              '\tmnt = real_mount(path->mnt);\n'
              '\tretval = -EINVAL;\n'
              '\tif (path->dentry != path->mnt->mnt_root)\n'
              '\t\tgoto out;\n'
              '\tif (!check_mnt(mnt))\n'
              '\t\tgoto out;\n'
              '\tif (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */\n'
              '\t\tgoto out;\n'
              '\tretval = -EPERM;\n'
              '\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n'
              '\t\tgoto out;\n'
              '\n'
              '\tretval = do_umount(mnt, flags);\n'
              'out:\n'
              '\t/* 不能调用 path_put(), 否则清除 mnt_expiry_mark (与 ksys_umount 同款) */\n'
              '\tdput(path->dentry);\n'
              '\tmntput_no_expire(mnt);\n'
              '\treturn retval;\n'
              '}\n'
              '\n'
          )
          if 'int path_umount(struct path *path, int flags)' not in s:
              s = s.replace(marker, funcs + marker, 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('patched: fs/namespace.c (injected path_umount)')
          else:
              print('path_umount already present')
          PYEOF
          grep -n "int path_umount" fs/namespace.c

      # ============ 4.6 跳过 modversions CRC 校验 (vendor 模块兼容) ============
      # 现象: 刷入自编译内核后 WiFi/蓝牙/音频全挂, dmesg 报
      #   "disagrees about version of symbol module_layout"
      # 原因: MODVERSIONS=y 时 module_layout 的 CRC = struct module 等
      #   5 个结构体的布局哈希; 官方 ROM 用 clang21/LTO/LLD 编译, 我们用
      #   clang14/GNU ld, struct 布局 CRC 无法复现 -> vendor 预编译模块
      #   (qca_cld3_wlan.ko/btpower/adsp/q6 等) 全部被拒。
      # 修复: kernel/module.c check_version() 对 CRC 不匹配直接放行
      #   (vermagic 仍校验, 需保持 MODVERSIONS=y + 版本号与官方一致);
      #   符号存在性仍由 find_symbol 保证。
      - name: 应用 modversions CRC 跳过 patch
        run: |
          cd kernel
          patch -p1 < ../patches/60_skip_modversions_crc.patch
          echo "--- 验证 CRC patch 已应用 ---"
          grep -n "跳过 modversions CRC 校验" kernel/module.c

      # ============ 4.7 提供假 __cfi_slowpath (官方 CFI 模块兼容) ============
      # 官方内核 CONFIG_CFI_CLANG=y (clang21 + LTO + LLD), vendor 分区预编译
      # 模块引用 __cfi_slowpath。自编译内核未开 CFI, 若不提供该符号, 模块
      # 加载报 "unknown symbol __cfi_slowpath" 被拒。提供假实现直接放行
      # (模块自身的 __cfi_check 不受影响, 功能完整)。
      - name: 应用 __cfi_slowpath 兼容 patch
        run: |
          cd kernel
          patch -p1 < ../patches/70_add_cfi_slowpath.patch
          echo "--- 验证 cfi patch 已应用 ---"
          grep -n "__cfi_slowpath" kernel/module.c

      # ============ 4.8 关闭 PREL32 对齐 struct kernel_symbol 布局 ============
      # 官方内核 CONFIG_LTO_CLANG=y (clang21 编译), arm64 Kconfig 的
      #   select HAVE_ARCH_PREL32_RELOCATIONS if !LTO_CLANG
      # 不生效 -> struct kernel_symbol 用 64 位指针布局 (24B/条目)。
      # 自编译内核不开 LTO -> PREL32=y (12B/条目), 内核按 12B 解析官方
      # 模块 24B 的 __ksymtab -> 符号名全部错位 (空名), 模块间符号引用
      # 全断 (如 swr_driver_register 找不到 -> 音频/蓝牙挂)。
      # 修复: 注释掉该 select, 强制 PREL32=n, 与官方模块布局对齐。
      - name: 应用关闭 PREL32 patch (对齐官方符号表布局)
        run: |
          cd kernel
          patch -p1 < ../patches/80_disable_prel32.patch
          echo "--- 验证 PREL32 patch 已应用 ---"
          grep -n "HAVE_ARCH_PREL32_RELOCATIONS" arch/arm64/Kconfig

      # ============ 5. 修复高通 trace include (clang 兼容) ============
      - name: 修复高通 TRACE_INCLUDE_PATH (clang 兼容)
        run: |
          cd kernel
          # 高通 trace.h 的 TRACE_INCLUDE_PATH 用相对路径 (如 "." / "../..")，
          # define_trace.h 展开成 #include "<路径>/<FILE>.h"——clang 不搜索
          # "主源文件所在目录"，相对路径全部解析不到。统一改为相对内核根的
          # 目录路径 + 纯文件名 (语义等价)。
          # 形态1: PATH=. FILE=纯名        (walt/rmnet/sde)
          # 形态2: PATH=. FILE=带路径      (cam_trace, FILE 需取 basename)
          # 形态3: PATH=../.. 带路径       (rndis_ipa/ipa_v3)
          grep -rln --exclude-dir=.git "#define TRACE_INCLUDE_PATH" \
            --include="*.h" . 2>/dev/null | while read f; do
            # 只修以 . 或 .. 开头(相对路径)的 PATH
            if grep -qE "^#define TRACE_INCLUDE_PATH \.\.?(/.*)?$" "$f"; then
              dir=$(dirname "$f" | sed 's|^\./||')
              [ "$dir" = "." ] && dir=""
              file=$(grep -m1 "^#define TRACE_INCLUDE_FILE" "$f" | sed 's|.*#define TRACE_INCLUDE_FILE *||; s| *$||')
              base=$(basename "$file")
              sed -i "s|^#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH $dir|" "$f"
              sed -i "s|^#define TRACE_INCLUDE_FILE .*|#define TRACE_INCLUDE_FILE $base|" "$f"
              echo "patched: $f  (PATH=$dir FILE=$base)"
            else
              echo "skip:    $f (PATH 已是根相对路径)"
            fi
          done
          echo "--- 验证 ---"
          grep -n "TRACE_INCLUDE" kernel/sched/walt/trace.h
          grep -n "TRACE_INCLUDE" techpack/camera/drivers/cam_utils/cam_trace.h

      # ============ 5.5 修复 tcpc inc/ 相对 include (clang 兼容) ============
      # drivers/usb/typec/tcpc/inc/ 下的头文件互相 include 时写了 "inc/xxx.h"
      # 前缀 —— 文件自身就在 inc/ 里, clang 在当前目录 (tcpc/inc/) 下找
      # inc/tcpci.h (= tcpc/inc/inc/tcpci.h) 必然失败。GCC 会搜主源文件目录
      # 兜住, clang 不会。去掉前缀即可 (同目录头文件)。
      - name: 修复 tcpc inc/ include (clang 兼容)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          f = 'drivers/usb/typec/tcpc/inc/pd_dpm_pdo_select.h'
          s = open(f, encoding='utf-8').read()
          old = '#include "inc/tcpci.h"'
          assert old in s, 'pattern not found in ' + f
          open(f, 'w', encoding='utf-8').write(s.replace(old, '#include "tcpci.h"', 1))
          print('tcpc inc/ include fixed')
          PYEOF
          grep -n 'include .tcpci' drivers/usb/typec/tcpc/inc/pd_dpm_pdo_select.h

      # ============ 5.6 修复 oplus_project section mismatch (modpost FATAL) ============
      # 现象: MODPOST vmlinux.o 阶段 FATAL: Section mismatches detected
      #   update_manifest() / update_telephony_manifest() 引用了 __initdata boot_command_line
      # 根因: drivers/soc/oplus/system/oplus_project/{qcom,gki}/oplus_project.c 里这两个
      #   函数未标 __init 却引用 boot_command_line (__initdata) —— modpost 默认将
      #   "非 init 函数引用 init 数据"视为致命错误 (holi-qgki_defconfig 显式关闭了
      #   CONFIG_SECTION_MISMATCH_WARN_ONLY)。它们只被 __init 的 oplus_project_init
      #   (arch_initcall) 调用, 加 __init 是正确修复 (init 内存还可释放)。
      - name: 修复 oplus_project section mismatch (modpost)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(fname, pairs):
              s = open(fname, encoding='utf-8').read()
              for old, new in pairs:
                  assert old in s, 'PATCH FAIL %s: %r' % (fname, old[:60])
                  s = s.replace(old, new, 1)
              open(fname, 'w', encoding='utf-8').write(s)
              print('OK', fname)

          for f in ['drivers/soc/oplus/system/oplus_project/qcom/oplus_project.c',
                    'drivers/soc/oplus/system/oplus_project/gki/oplus_project.c']:
              s = open(f, encoding='utf-8').read()
              if 'parent_1, struct proc_dir_entry *parent_2' in s:
                  pairs = [
                      ('static void update_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)',
                       'static void __init update_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)'),
                      ('static void update_telephony_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)',
                       'static void __init update_telephony_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)'),
                  ]
              else:
                  pairs = [
                      ('static void update_manifest(struct proc_dir_entry *parent)',
                       'static void __init update_manifest(struct proc_dir_entry *parent)'),
                      ('static void update_telephony_manifest(struct proc_dir_entry *parent)',
                       'static void __init update_telephony_manifest(struct proc_dir_entry *parent)'),
                  ]
              patch(f, pairs)
          PYEOF
          grep -rn '__init update_manifest\|__init update_telephony' drivers/soc/oplus/system/oplus_project/

      # ============ 6. 配置 + 编译 ============
      # 注意: 编译命令带 KCFLAGS=-I. —— 高通源码里的相对 include (如
      # arch/arm64/kernel/trace-events-emulation.h) 需要内核根在搜索路径中；
      # -I. 在搜索链末尾，不会影响正常 include。
      - name: 恢复 ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-oscar-${{ github.event.inputs.kernel_branch }}-

      - name: 配置内核 (holi-qgki defconfig + SukiSU 开关)
        run: |
          cd kernel
          export PATH=$PWD/../clang/clang-r510928/bin:$PATH
          # 用 clang 作为 CC + GNU 交叉工具链 (binutils-aarch64-linux-gnu)，不需要 ld.lld，最稳
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS='-I. -Idrivers/usb/typec/tcpc' vendor/holi-qgki_defconfig
          # ★ LineageOS 官方 oscar 构建 = holi-qgki_defconfig + debugfs.config 合并
          #   (device/realme/sm6375-common BoardConfigCommon.mk:
          #    TARGET_KERNEL_CONFIG := vendor/holi-qgki_defconfig vendor/debugfs.config)
          #   debugfs.config 内容: CONFIG_PAGE_OWNER=n / CONFIG_DEBUG_FS=n ——
          #   只编 defconfig 会得到 DEBUG_FS=y/PAGE_OWNER=y, 与官方 config 不一致
          #   (dmesg 实证 2026-08: modversions CRC 校验失败, vendor 模块全拒)。
          ./scripts/config -d DEBUG_FS -d PAGE_OWNER
          # ★ 官方 config 关键项钉死 (对照设备实测 config_official.txt, 防 defconfig 漂移):
          #   /data = f2fs + fscrypt inlinecrypt 硬件内联加密 (官方 mount: ...inlinecrypt,
          #   /dev/block/dm-42)。BLK_INLINE_ENCRYPTION/F2FS/FS_ENCRYPTION_INLINE_CRYPT/
          #   DM_CRYPT/crypto 任一缺失或变 m, vold init_user0 (用户0数据初始化) 必失败。
          #   显式 -e/-d, 不依赖 defconfig 默认 (2026-10-11 设备实证 init_user0_failed 排查)。
          ./scripts/config \
            -e BLK_INLINE_ENCRYPTION -e BLK_INLINE_ENCRYPTION_FALLBACK \
            -e F2FS_FS -e F2FS_STAT_FS -e F2FS_FS_XATTR \
            -e F2FS_FS_POSIX_ACL -e F2FS_FS_SECURITY \
            -e FS_ENCRYPTION -e FS_ENCRYPTION_ALGS -e FS_ENCRYPTION_INLINE_CRYPT \
            -e DM_CRYPT -e DM_DEFAULT_KEY -e BLK_DEV_DM \
            -e CRYPTO_ECB -e CRYPTO_XTS -e CRYPTO_AES -e CRYPTO_SHA512 \
            -d F2FS_CHECK_FS -d F2FS_FAULT_INJECTION
          # 开启 ReSukiSU + SUSFS 全部 9 个子开关 (SUS_PATH/SUS_MOUNT/SUS_KSTAT/
          # SPOOF_UNAME/ENABLE_LOG/HIDE_KSU_SUSFS_SYMBOLS/SPOOF_CMDLINE_OR_BOOTCONFIG/
          # OPEN_REDIRECT/SUS_MAP)。ReSukiSU Kconfig: KSU_SUSFS 依赖
          # THREAD_INFO_IN_TASK && 64BIT —— 5.4 arm64 满足。
          # ★ 版本号必须与官方 ROM 完全一致 (2026-10-11 设备实证更新):
          #   vendor 分区预编译模块 (qca_cld3_wlan.ko/btpower/adsp/q6 等) 加载时
          #   校验 vermagic, 本机 (已刷 23.2-20261005-nightly-oscar) 运行内核
          #   = 5.4.302-qgki-g84e7d691ee3a, 官方模块期望
          #   '5.4.302-qgki-g84e7d691ee3a SMP preempt
          #   mod_unload modversions aarch64'。若版本带 -dirty (patch 后 git 树脏 +
          #   CONFIG_LOCALVERSION_AUTO) 或关闭 MODVERSIONS (vermagic 少 modversions
          #   标记), 全部 vendor 模块拒绝加载 (WiFi/蓝牙/音频全挂)。
          # 修复: -d CONFIG_LOCALVERSION_AUTO 去掉自动后缀, 写死官方 LOCALVERSION
          #   (g84e7d691ee3a = lineage-23.2 分支 tip, 与已刷系统一致);
          #   保持 MODVERSIONS=y (官方默认 y)。
          # KSU_TRACEPOINT_HOOK 是 GKI 2 (5.10+) 的 tracepoint 模式, 5.4 不用, 显式关闭。
          ./scripts/config -e KSU -e KALLSYMS -e KALLSYMS_ALL \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -d KSU_TRACEPOINT_HOOK \
            -d CONFIG_LOCALVERSION_AUTO \
            --set-str CONFIG_LOCALVERSION "-qgki-g84e7d691ee3a" || true
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            ./scripts/config --set-str LOCALVERSION "-${{ github.event.inputs.custom_version }}"
          fi
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE' olddefconfig
          echo "--- 配置验证 ---"
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS|CONFIG_LOCALVERSION|CONFIG_DEBUG_FS|CONFIG_PAGE_OWNER|CONFIG_MODVERSIONS" .config \
            || echo "!! 未找到 KSU/SUSFS 配置，请检查 ReSukiSU 集成是否成功"
          # ★ 存储/加密/文件系统关键项 =y 断言 (对照官方 config_official.txt)
          CFG_FAIL=0
          for k in \
            CONFIG_BLK_INLINE_ENCRYPTION CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK \
            CONFIG_F2FS_FS CONFIG_F2FS_STAT_FS CONFIG_F2FS_FS_XATTR \
            CONFIG_F2FS_FS_POSIX_ACL CONFIG_F2FS_FS_SECURITY \
            CONFIG_FS_ENCRYPTION CONFIG_FS_ENCRYPTION_ALGS CONFIG_FS_ENCRYPTION_INLINE_CRYPT \
            CONFIG_DM_CRYPT CONFIG_DM_DEFAULT_KEY CONFIG_BLK_DEV_DM \
            CONFIG_CRYPTO_ECB CONFIG_CRYPTO_XTS CONFIG_CRYPTO_AES CONFIG_CRYPTO_SHA512 \
            CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC CONFIG_MODVERSIONS; do
            grep -q "^${k}=y" .config || { echo "!! ${k} 应为 =y: 实际 $(grep -E "^(# )?${k}=" .config | head -1 | sed 's/^/  /' || echo 缺失)"; CFG_FAIL=1; }
          done
          for k in CONFIG_DEBUG_FS CONFIG_PAGE_OWNER CONFIG_F2FS_CHECK_FS CONFIG_F2FS_FAULT_INJECTION; do
            grep -q "^# ${k} is not set" .config || { echo "!! ${k} 应为关闭"; CFG_FAIL=1; }
          done
          [ $CFG_FAIL -eq 0 ] && echo "OK: 存储/加密/文件系统项与官方 config 一致 (f2fs+fscrypt inlinecrypt 就绪)" \
            || { echo "!! config 关键项不一致, 中止"; exit 1; }
          # 完整 .config 导出到工作区 (上传 artifact), 供 boot 失败时逐项比对官方配置
          cp .config ../kernel_config.txt
          echo "kernel_config.txt 已导出: $(wc -l < ../kernel_config.txt) 行"
          # ★ PREL32 必须为关闭 (80_ patch 注释了 select): 官方 LTO 内核无 PREL32,
          #   模块 __ksymtab 为 24B/条目; 若 PREL32=y (12B) 则模块导出符号名错位
          #   (kallsyms 大量 $x 乱码), 模块间符号引用全断 (WiFi/蓝牙/音频挂)。
          grep "HAVE_ARCH_PREL32" .config \
            && echo "!! PREL32 仍开启 (80_ patch 未生效?)" \
            || echo "OK: PREL32 已关闭 (与官方 LTO 内核布局对齐)"

      - name: 编译内核 (ccache 加速)
        run: |
          cd kernel
          # 空 .scmversion 让 scripts/setlocalversion 的 scm_version() 直接返回空:
          # 本树被大量 patch 弄脏且 HEAD 不在精确 tag 上, 否则 setlocalversion 会
          # 在版本后追加 '+' (git 非 tag 状态标记), 混入 vermagic 导致 vendor 模块
          # 拒载 (官方 nightly 内核无 '+': uname = 5.4.302-qgki-g84e7d691ee3a)。
          touch .scmversion
          export PATH=$PWD/../clang/clang-r510928/bin:$PATH
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 2G
          # 首次全量编译约 40-90 分钟；二次构建命中 ccache 大幅提速
          # KCFLAGS=-I. 让内核根进入 include 搜索链 (高通相对 include 必需)
          # -Idrivers/usb/typec/tcpc 兜底 tcpc 的 inc/ 前缀 include
          # -DKSU_COMPAT_HAS_SELINUX_STATE: 5.4 高通 selinux_state 无 GKI 字段,
          # 该宏触发 ReSukiSU selinux.c 的 5.4 兼容分支 (selinux_hide fake_state)
          # -Wno-fortify-source: clang18 (r510928) 在 lineage-23.2 更新的 vendor
          #   源码 (techpack/camera/cam_io_util.c, oplus touchpanel) 报 snprintf
          #   截断 -Werror, 官方 clang21 构建无此检查 (2026-10 修复, 仅影响
          #   调试打印路径, 不影响功能)。
          make ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE -Wno-fortify-source' -j$(nproc)
          ls -la arch/arm64/boot/Image
          echo "--- 内核版本 ---"
          strings arch/arm64/boot/Image | grep -m1 "Linux version"
          # ★ vermagic 对齐断言: 必须与已刷系统内核完全一致。
          #   用 'g84e7d691ee3a (' 精确匹配 (官方版式: hash 后跟空格+括号);
          #   若版本带 '+' (如 'g84e7d691ee3a+ (') 则匹配失败, 阻止 dirty 标记漏过。
          strings -a arch/arm64/boot/Image | grep -m1 "Linux version 5.4.302-qgki-g84e7d691ee3a (" \
            || { echo "!! 内核版本与已刷系统不一致 (期望 5.4.302-qgki-g84e7d691ee3a, 无 dirty '+')"; exit 1; }
          echo "OK: vermagic 与已刷系统一致 (5.4.302-qgki-g84e7d691ee3a)"

      # ============ 6. 原版 boot.img (缓存) ============
      - name: 恢复原版 boot.img 缓存
        id: cache-boot
        uses: actions/cache/restore@v6
        with:
          path: boot.img
          key: boot-oscar-${{ github.event.inputs.los_date }}

      - name: 从 LineageOS nightly 获取原版 boot.img (直链或 payload 提取)
        if: steps.cache-boot.outputs.cache-hit != 'true'
        run: |
          set -e
          # 0) 官方 API 查询当天 boot.img 的 sha256 (用于下载后校验)
          EXPECT_SHA=""
          if curl -s --max-time 20 "https://download.lineageos.org/api/v2/devices/${DEVICE}/builds" -o los_builds.json; then
          EXPECT_SHA=$(python3 -c "
          import json
          d = json.load(open('los_builds.json'))
          date = '${{ github.event.inputs.los_date }}'
          for b in d:
              if b.get('date','').replace('-','') == date:
                  for f in b.get('files',[]):
                      if f.get('filename') == 'boot.img':
                          print(f.get('sha256',''))
          ")
            rm -f los_builds.json
            echo "官方 API 返回 boot.img sha256: $EXPECT_SHA"
          else
            echo "官方 API 不可用, 跳过 sha256 校验"
          fi
          # 1) 依次尝试 boot.img 直链 (文件名就是 boot.img): 官方 mirrorbits + freedif 镜像
          #    (oscar nightly 构建提供独立 boot.img, 160MB 分区镜像)
          for BOOT_URL in \
            "https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img" \
            "https://mirror.freedif.org/lineageos/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img"; do
            echo "尝试直链: $BOOT_URL"
            HTTP=$(curl -sL -o boot.img -w '%{http_code}' --retry 3 "$BOOT_URL" || echo 000)
            if [ "$HTTP" = "200" ] && [ -s boot.img ]; then
              echo "直链下载成功: $(stat -c%s boot.img) bytes"
              break
            fi
            rm -f boot.img
          done
          if [ -s boot.img ]; then
            echo "boot.img 就绪 (直链)"
          else
            # 2) 直链全失败 → payload.bin 提取 (oscar nightly 为 A/B OTA 包)
            echo "直链均不可用, 改用 payload.bin 提取"
            LOS_URL="https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/lineage-${{ github.event.inputs.los_version }}-${{ github.event.inputs.los_date }}-nightly-${DEVICE}-signed.zip"
            echo "下载: $LOS_URL"
            curl -sL --retry 3 -o los.zip "$LOS_URL"
            unzip -o los.zip payload.bin
            rm -f los.zip
            if [ ! -x ./payload-dumper-go ]; then
              PDG_URL=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if 'linux_amd64' in a['name']][0])")
              echo "下载 payload-dumper-go: $PDG_URL"
              curl -sL -o pdg.tar.gz "$PDG_URL"
              tar -xzf pdg.tar.gz
              rm -f pdg.tar.gz
            fi
            ./payload-dumper-go -o . -p boot payload.bin
            rm -f payload.bin
            ls -la boot.img
          fi
          # 3) 校验: ANDROID! magic + sha256 (有期望值时)
          python3 -c "
          with open('boot.img','rb') as f:
              magic = f.read(8)
          assert magic == b'ANDROID!', 'boot.img magic 校验失败: %r' % magic
          print('boot.img magic OK')
          "
          if [ -n "$EXPECT_SHA" ]; then
            ACTUAL_SHA=$(sha256sum boot.img | cut -d' ' -f1)
            echo "实际 sha256: $ACTUAL_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECT_SHA" ]; then
              echo "!! sha256 不匹配: 期望 $EXPECT_SHA"
              exit 1
            fi
            echo "sha256 校验通过"
          fi
          test -s boot.img
          echo "boot.img 就绪"

      - name: 保存原版 boot.img 缓存
        if: steps.cache-boot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: boot.img
          key: boot-oscar-${{ github.event.inputs.los_date }}

      # ============ 7. 打包 + 上传 ============
      - name: 解包原 boot + 打包 new_boot.img
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --out boot_split
          ls boot_split/
          # ★ header_version 必须 =3: ABL 只接受 v3 头 (设备实测: v4头 -> init_user0_failed -> recovery)
          # 用官方工具 --format mkbootimg -0 读回权威参数 (unpack 不落 header_version 文件, 不能 cat fallback)
          BOOT_ARGS=$(python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --format mkbootimg -0 2>/dev/null | tr '\0' '\n')
          HDR_VER=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--header_version$' | tail -1)
          OS_VER=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--os_version$' | tail -1)
          OS_PATCH=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--os_patch_level$' | tail -1)
          [ -n "$HDR_VER" ] || HDR_VER=3
          if [ "$HDR_VER" != "3" ]; then
            echo "!! 官方 header_version=$HDR_VER 非 3, 强制 3 (ABL 只接受 v3)"
            HDR_VER=3
          fi
          [ -n "$OS_VER" ]   || OS_VER=16.0.0
          [ -n "$OS_PATCH" ] || OS_PATCH=2026-09
          echo "os_version=$OS_VER os_patch=$OS_PATCH header=$HDR_VER (≥v3 断言通过)"
          python3 mkbootimg/mkbootimg.py \
            --kernel kernel/arch/arm64/boot/Image \
            --ramdisk boot_split/ramdisk \
            --cmdline "$(cat boot_split/cmdline 2>/dev/null)" \
            --header_version $HDR_VER \
            --os_version "$OS_VER" --os_patch_level "$OS_PATCH" \
            -o new_boot.img
          echo "=== 打包完成 ==="
          ls -la new_boot.img

      - name: 验证产物
        run: |
          # ★ 新 boot 必须为 header_version=3, 否则 ABL 不启动
          NEW_HDR=$(python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --format mkbootimg -0 2>/dev/null | tr '\0' '\n' | grep -A1 '^--header_version$' | tail -1)
          echo "new_boot header_version=$NEW_HDR"
          [ "$NEW_HDR" = "3" ] || { echo "!! new_boot.img header_version=$NEW_HDR != 3 (ABL 只接受 v3), 终止"; exit 1; }
          python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --out new_split
          echo "--- 新 boot 打包参数 ---"
          python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --format mkbootimg 2>/dev/null
          echo "原 boot 内核大小: $(stat -c%s boot_split/kernel)"
          echo "新 boot 内核大小: $(stat -c%s new_split/kernel)"
          echo "new_boot.img MD5: $(md5sum new_boot.img)"
          sha256sum new_boot.img > SHA256SUMS.txt

      - name: 保存 ccache (构建成功才更新，供下次加速)
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-newboot-v3
          path: |
            new_boot.img
            SHA256SUMS.txt
            kernel/arch/arm64/boot/Image
            kernel_config.txt
          if-no-files-found: error
