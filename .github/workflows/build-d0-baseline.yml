# ============================================================
# D0/E1 基线构建: 完全按 LineageOS 官方 oscar 构建条件的干净内核 boot
# Realme Q5 / 9 5G (oscar, RMX3478) | SM6375 (holi) | 内核 5.4 QGKI
#
# 目的 (专家裁决后新增): 建立"与官方 nightly boot.img 内核层面等价"的可信
#   对照基线, 用于定位 new_boot (ReSukiSU) init_user0_failed 的根因是否来自
#   [无 LTO/CFI 自编译 + 假 __cfi_slowpath + 官方 CFI 模块] 的组合不兼容。
#
# ★ 双模式 (workflow_dispatch 的 mode 输入):
#   - official (默认): D0 干净基线, 官方配方 (clang21 + LTO/CFI/LLD + O=), 无 KSU,
#     artifact = d0-baseline-official-boot。设备实测 ✅ 正常开机。
#   - ksu: E1/E2 —— 同一官方配方基底 + ReSukiSU/SUSFS 集成。
#     E0 判别实验 (2026-10-11 设备实测) 已定论: 断电关机根因是"clang18 非 LTO +
#     假 __cfi_slowpath + 关 PREL32"失败配方本身, 与 KSU/SUSFS 补丁无关; 因此在
#     已验证可开机的官方配方上构建 KSU。(失败配方对症: 不打 60_/70_/80_ hack,
#     不做 TRACE_INCLUDE/tcpc/oplus 修复 —— O= + clang21 天然无需)。
#   ★ E1 (2026-10) = KSU-only-on-official: v4.1.0 无 SUSFS 符号, SUSFS 未启用,
#     artifact = resukisu-official-lto, 设备实测 ✅ 正常开机 + root。
#   ★ E2 = KSU + SUSFS 完整启用: 升级 ReSukiSU 至 v4.2.0-rc1 (自带 SUSFS Kconfig
#     全段 + ksu_is_* static_key 符号, 与 50_ patch 完全匹配), 9 项 SUSFS 功能全开,
#     artifact = resukisu-susfs。KSU_MANUAL_SU 选项已并入 sucompat (默认开启),
#     manager 需换装 40856 (KSU_APP_PROFILE_VER=4)。
#
# 与官方对齐点 (对照设备 /proc/config.gz = config_official.txt):
#   - 内核源码 commit 84e7d691ee3a (lineage-23.2 分支 tip, 与已刷系统一致)
#   - 官方同款 prebuilt clang21 (clang-r563880c, Image 内 'clang version 21.0.0')
#   - vendor/holi-qgki_defconfig (自带 LTO_CLANG/CFI_CLANG/LOCALVERSION=-qgki)
#   - 合并官方 debugfs.config 的正式等值: -d CONFIG_DEBUG_FS -d CONFIG_PAGE_OWNER
#     (官方运行 config 实测 DEBUG_FS/PAGE_OWNER 均 not set; 全量合并 holi_debug.
#     config 反而会带入 CMA_DEBUGFS 等官方没有的 debug=y 与 LOCALVERSION
#     =-qgki-debug, 故采用与官方 config 完全一致的等值做法)
#   - 官方同款工具链参数: LD=ld.lld (LD_IS_LLD) + llvm-nm/llvm-objcopy
#     (TOOLS_SUPPORT_RELR) + LLVM_IAS -> LTO_CLANG/THINLTO/CFI_CLANG/
#     CFI_CLANG_SHADOW/RELR/COMPAT_VDSO 全部解锁, 与官方 config 一致
#   - O= 分离构建 (官方 Android build.sh: make ... O=$OUT_DIR):
#     ★ 必须 O= 才能注入 -I$(srctree)/$(src) (Makefile.lib), 否则
#       kernel/sched/walt/trace.h 的 #include "./trace.h" 无法找到自身
#       (in-tree 构建缺少 -I kernel/sched/walt -> define_trace.h:95
#       'fatal error: ./trace.h file not found')。官方 Image 内含
#       sched_update_pred_demand 等 walt trace 符号, 证明官方正是 O= 构建。
#   - 版本串: official = 官方一致 (LOCALVERSION=-qgki + AUTO=y + 干净树 ->
#     -g84e7d691ee3a); ksu = -d AUTO + 写死 LOCALVERSION="-qgki-g84e7d691ee3a"
#     + touch .scmversion (集成 patch 弄脏树, 防 -dirty/+ 混入 vermagic)
#
# 用法: Actions -> D0/E1 基线 -> Run workflow (los_date 填 nightly 日期, mode 选 ksu)
# 产物 artifact: d0-baseline-official-boot / resukisu-official-lto
#   (new_boot.img + SHA256SUMS + config)
# ============================================================
name: D0/E1 基线 (Official-parity boot / KSU-on-official)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支 (默认 lineage-23.2)'
        required: true
        type: string
        default: 'lineage-23.2'
      los_version:
        description: 'LineageOS 版本'
        required: true
        type: string
        default: '23.2'
      los_date:
        description: 'LineageOS nightly 日期 YYYYMMDD'
        required: true
        type: string
        default: '20261005'
      mode:
        description: '构建模式: official = D0 官方配方干净基线(默认); ksu = 官方配方 + ReSukiSU v4.2.0-rc1 + SUSFS 全功能 (E2)'
        required: true
        type: choice
        options:
          - official
          - ksu
        default: 'official'

env:
  DEVICE: 'oscar'
  KERNEL_COMMIT: '84e7d691ee3a094de68628c488847a4dd632e7eb'
  CLANG_VER: 'clang-r563880c'
  KERNEL_OUT: 'kernel-out'   # O= 分离构建输出目录 (官方 Android build.sh O=$OUT_DIR)

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc flex bison bc cpio lz4 xz-utils \
            libssl-dev libncurses-dev libelf-dev unzip zip python3 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu ccache
          df -h "$GITHUB_WORKSPACE"
          FREE_KB=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1)
          if [ "$FREE_KB" -lt 25000000 ]; then
            echo "!! 磁盘剩余 ${FREE_KB}KB < 25GB, D0 可能放不下 clang21+内核+构建物"; exit 1
          fi

      - name: 下载内核源码 + 锁定官方 commit
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/LineageOS/android_kernel_realme_sm6375 kernel
          cd kernel
          # depth-1 + branch tip 即官方 commit; 强制 checkout 全量 hash (防漂移)
          git checkout -f ${{ env.KERNEL_COMMIT }}
          echo "内核 commit: $(git rev-parse --short HEAD)"
          # 版本串需要 setlocalversion 输出 -g<12hex>: 无 tag -> 与官方一致
          git tag | wc -l

      - name: 下载官方 prebuilt clang21 (clang-r563880c)
        run: |
          # AOSP prebuilts 的 main 分支已移除 clang-r563880c 目录。
          # commit f8439f0628d799092dd07df440a6334cab28939c 的 tree 仍含该目录
          # (AndroidVersion.txt: 21.0.0 / based on r563880c —— 与官方 oscar nightly
          #  Image 内 'Android (14054515,...based on r563880c) clang version 21.0.0'
          #  完全一致; LOS 官方 sm8250 也是 Use Clang r563880c)。
          # gitiles 路径历史 API 需登录, 故用固定 commit + blob:none 部分克隆 +
          # sparse-checkout 单目录 (只拉该版本的 blob, 实测 3.7G)。
          # ★ 顺序关键: 必须先 sparse-checkout set 再 checkout commit, 否则会把
          #   整棵 prebuilts tree 全部 checkout (数十 GB)。
          rm -rf clang-prebuilts && git clone --filter=blob:none --no-checkout --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilts
          cd clang-prebuilts
          git sparse-checkout init --cone
          git sparse-checkout set ${{ env.CLANG_VER }}
          git checkout -q f8439f0628d799092dd07df440a6334cab28939c
          chmod +x ${{ env.CLANG_VER }}/bin/* 2>/dev/null || true
          test -x ${{ env.CLANG_VER }}/bin/clang || { echo "!! clang 缺失"; exit 1; }
          ${{ env.CLANG_VER }}/bin/clang --version | head -2
          test -x ${{ env.CLANG_VER }}/bin/ld.lld || { echo "!! ld.lld 缺失"; exit 1; }
          ls ${{ env.CLANG_VER }}/bin/ | grep -E "^(clang$|ld.lld$|llvm-(ar|nm|objcopy|strip)$)" | tr '\n' ' '; echo

      # ============ ★ mode=ksu: KSU/SUSFS 集成 (官方配方基底, 无失败配方 hack) ============
      # E0 判别结论 (2026-10-11 设备实测): 断电关机根因是"clang18 非 LTO + 假
      #   __cfi_slowpath + 关 PREL32"配方本身, 与 KSU/SUSFS 补丁无关。因此现在在
      #   D0 已验证可开机的官方配方 (clang21 + LTO/CFI/LLD + O=) 上集成 KSU。
      #   失败配方 hack 全部不引入: 无 60_(CRC跳过)/70_(假__cfi_slowpath)/80_(关PREL32);
      #   无 TRACE_INCLUDE/tcpc/oplus 修复 (O= + clang21 天然解决)。
      #   保留的是 "KSU 对 5.4 的 API 适配" (task_work/sepolicy/rules/pkg_observer/
      #   path_umount/SUSFS 5.4 patch)。
      - name: 集成 ReSukiSU (锁定 v4.2.0-rc1 + symlink)
        if: env.MODE == 'ksu'
        run: |
          cd kernel
          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          cd KernelSU
          git checkout v4.2.0-rc1
          echo "ReSukiSU commit: $(git log --oneline -1)"
          ls kernel/Kbuild kernel/Kconfig kernel/selinux/selinux.c && echo "结构正确 (kernel/ 目录)"
          cd ..
          ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          ls -la drivers/kernelsu/ | head -5
          grep -n "kernelsu" drivers/Makefile

      - name: 修复 ReSukiSU 的 5.4 (sm6375) API 兼容
        if: env.MODE == 'ksu'
        run: |
          cd kernel
          if ! git -C KernelSU rev-parse --verify --quiet miuix >/dev/null; then
            git -C KernelSU branch miuix HEAD
          fi
          echo "miuix 分支 commit 数: $(git -C KernelSU rev-list --count miuix)"
          # ============ v4.2.0-rc1: 5.4 兼容绝大多数已由上游内置 ============
          # kernel_compat.mk 自动检测 oscar 5.4 树并塞 ccflags:
          #   TWA_RESUME fallback (compat/kernel_compat.h <5.7 -> true)
          #   put_seccomp_filter (kernel_compat.mk 检测无此符号 -> OPTIONAL_SECCOMP_FILTER_RELEASE,
          #                       app_profile.c 的 5.9-/分支自动走 memcpy fake 路径)
          #   pgtable (sucompat.c: <5.8 -> asm/pgtable.h)
          #   selinux_state (kernel_compat.mk 检测 security.h 有 struct selinux_state
          #                  -> KSU_COMPAT_HAS_SELINUX_STATE; rules.c get_policydb
          #                  的 KSU_COMPAT_USE_SELINUX_STATE 分支)
          #   filename_trans (<5.9 走 hashtab_search(&db->filename_trans))
          #   security_add_hooks (5.4 命名, 5.10+ 才改 lsm_add_hook)
          #   minmax.h/overflow.h (检测 wildcard)
          #   5.4 走 hook/lsm_hooks.o 而非 pkg_observer (Kbuild 的 $VERSION -lt 6 分支),
          #   规避 pkg_observer 的新式 fsnotify 签名 (那是 6.8+ 才用的)
          #
          # 仍需手动处理的 (rc1 未覆盖 / 与 oscar 5.4 的残余差异):
          python3 - <<'PYEOF'
          import glob, re
          # 1) Kbuild KSU_VERSION fallback (无 miuix 历史时 expr 为空 -> 兜底 13000)
          kb = 'KernelSU/kernel/Kbuild'
          ks = open(kb, encoding='utf-8').read()
          if '|| echo 13000' not in ks:
              m = re.search(r'KSU_VERSION := \$\$\(shell expr ([^\n]+)\)', ks)
              assert m, 'Kbuild KSU_VERSION expr line not found'
              old = m.group(0)
              new = old[:-1] + ' 2>/dev/null || echo 13000)'
              ks = ks.replace(old, new)
              open(kb, 'w', encoding='utf-8').write(ks)
              print('patched: KernelSU/kernel/Kbuild (KSU_VERSION fallback 13000)')
          else:
              print('Kbuild KSU_VERSION fallback already present')
          # 2) sched/task.h include: put_task_struct 在 5.4 位于 linux/sched/task.h
          #    (rc1 若只 include linux/sched.h 则编译失败)
          files = glob.glob('KernelSU/kernel/**/*.c', recursive=True)
          for f in files:
              s = open(f, encoding='utf-8').read()
              orig = s
              if 'put_task_struct' in s and '#include <linux/sched/task.h>' not in s:
                  m = re.search(r'(#include <linux/[^\n]+>)', s)
                  if m:
                      s = s[:m.start()] + m.group(1) + '\n#include <linux/sched/task.h>' + s[m.end():]
              if s != orig:
                  open(f, 'w', encoding='utf-8').write(s)
                  print('patched:', f, '(sched/task.h)')
          PYEOF
          echo "--- 验证 ---"
          grep -rln "put_task_struct" KernelSU/kernel/ | while read f; do grep -q "sched/task.h" "$f" || { echo "!! $f 缺 sched/task.h"; exit 1; }; done
          echo "OK: put_task_struct 文件均已 include sched/task.h"
          echo "OK: TWA_RESUME/put_seccomp_filter/pgtable 由 rc1 kernel_compat 自适配, 无需手动"

      - name: 应用 SUSFS 5.4 patch
        if: env.MODE == 'ksu'
        run: |
          cd kernel
          patch -p1 < ../patches/50_add_susfs_in_kernel-5.4.patch
          echo "--- 验证 SUSFS 已集成 ---"
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep -n "susfs" fs/Makefile
          grep -c "CONFIG_KSU_SUSFS" fs/namei.c

      - name: 注入 path_umount 到 fs/namespace.c (修复 kernel_umount 链接)
        if: env.MODE == 'ksu'
        run: |
          cd kernel
          python3 - <<'PYEOF'
          f = 'fs/namespace.c'
          s = open(f, encoding='utf-8').read()
          marker = 'static bool is_mnt_ns_file(struct dentry *dentry)'
          assert marker in s, 'is_mnt_ns_file marker not found in namespace.c'
          funcs = (
              'int path_umount(struct path *path, int flags)\n'
              '{\n'
              '\tstruct mount *mnt;\n'
              '\tint retval;\n'
              '\n'
              '\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n'
              '\t\treturn -EINVAL;\n'
              '\n'
              '\tif (!may_mount())\n'
              '\t\treturn -EPERM;\n'
              '\n'
              '\tmnt = real_mount(path->mnt);\n'
              '\tretval = -EINVAL;\n'
              '\tif (path->dentry != path->mnt->mnt_root)\n'
              '\t\tgoto out;\n'
              '\tif (!check_mnt(mnt))\n'
              '\t\tgoto out;\n'
              '\tif (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */\n'
              '\t\tgoto out;\n'
              '\tretval = -EPERM;\n'
              '\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n'
              '\t\tgoto out;\n'
              '\n'
              '\tretval = do_umount(mnt, flags);\n'
              'out:\n'
              '\t/* 不能调用 path_put(), 否则清除 mnt_expiry_mark (与 ksys_umount 同款) */\n'
              '\tdput(path->dentry);\n'
              '\tmntput_no_expire(mnt);\n'
              '\treturn retval;\n'
              '}\n'
              '\n'
          )
          if 'int path_umount(struct path *path, int flags)' not in s:
              s = s.replace(marker, funcs + marker, 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('patched: fs/namespace.c (injected path_umount)')
          else:
              print('path_umount already present')
          PYEOF
          grep -n "int path_umount" fs/namespace.c

      - name: "配置内核 (官方等值: defconfig + LTO/CFI/LLD 全解锁)"
        run: |
          cd kernel
          export PATH=$PWD/../clang-prebuilts/${{ env.CLANG_VER }}/bin:$PATH
          # 官方 BoardConfigCommon.mk 把 vendor/debugfs.config 并入构建, 其内容即
          # "-d CONFIG_PAGE_OWNER -d CONFIG_DEBUG_FS" (官方运行 config 实证两者均 off)。
          # 全量合并 holi_debug.config 反而会带入 CMA_DEBUGFS 等官方没有的 debug=y,
          # 故用等值 -d, 与官方 /proc/config.gz 零差异 (config_official.txt 已双向核对)
          # ★ O= 分离构建 (官方 build.sh 同款): 使 building_out_of_srctree=1,
          #   kbuild 注入 -I$(srctree)/$(src) -> walt trace.h 相对 include 可解析
          make O=${{ env.KERNEL_OUT }} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip AR=llvm-ar LLVM_IAS=1 \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc' vendor/holi-qgki_defconfig
          ./scripts/config --file ${{ env.KERNEL_OUT }}/.config -d DEBUG_FS -d PAGE_OWNER
          # ★ mode=ksu (E2): 启用 KSU + SUSFS 全功能。ReSukiSU v4.2.0-rc1 的
          #   kernel/Kconfig 自带完整 SUSFS 段 (KSU_SUSFS + 9 子开关), 无需补丁;
          #   50_ patch (内核侧 #ifdef + inline_hook_check) 与 rc1 符号完全匹配
          #   (DEFINE_STATIC_KEY_TRUE 定义 ksu_is_* static_key)。
          #   ★ rc1 已移除 KSU_MANUAL_SU 选项 (manual_su 并入 feature/sucompat.c
          #     无条件编译 + ksu_su_compat_enabled static_key 默认开) —— 不再 -e。
          #   ★ Hook 方法三选一 (TRACEPOINT/MANUAL_HOOK/SUSFS), default=TRACEPOINT
          #     (仅 GKI2 5.10+), 必须显式 -e KSU_SUSFS, 否则 5.4 走 TRACEPOINT 报错。
          #   LOCALVERSION: 集成 patch 弄脏 git 树后 AUTO=y 会自动追加 -dirty 进
          #   vermagic (vendor 模块拒载), 故 ksu 模式必须 -d AUTO + 写死官方版本串。
          if [ "$MODE" = "ksu" ]; then
            touch .scmversion   # 空文件: 抑制 setlocalversion 的 git 附加后缀 (防 '+' 混入 vermagic)
            ./scripts/config --file ${{ env.KERNEL_OUT }}/.config \
              -e KSU -e KALLSYMS -e KALLSYMS_ALL \
              -d KSU_TRACEPOINT_HOOK -d KSU_MANUAL_HOOK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -d KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -d CONFIG_LOCALVERSION_AUTO \
              --set-str CONFIG_LOCALVERSION "-qgki-g84e7d691ee3a" || true
          fi
          make O=${{ env.KERNEL_OUT }} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip AR=llvm-ar LLVM_IAS=1 \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc' olddefconfig
          echo "--- 关键项断言 (官方 config_official.txt 对照) ---"
          for k in CONFIG_LTO_CLANG CONFIG_THINLTO CONFIG_CFI_CLANG \
            CONFIG_CFI_CLANG_SHADOW CONFIG_LD_IS_LLD CONFIG_RELR \
            CONFIG_COMPAT_VDSO CONFIG_GENERIC_COMPAT_VDSO \
            CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC CONFIG_MODVERSIONS \
            CONFIG_BLK_INLINE_ENCRYPTION CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK \
            CONFIG_F2FS_FS CONFIG_F2FS_FS_XATTR CONFIG_F2FS_FS_SECURITY \
            CONFIG_FS_ENCRYPTION CONFIG_FS_ENCRYPTION_ALGS \
            CONFIG_FS_ENCRYPTION_INLINE_CRYPT CONFIG_DM_CRYPT \
            CONFIG_CRYPTO_ECB CONFIG_CRYPTO_XTS; do
            grep -q "^${k}=y" ${{ env.KERNEL_OUT }}/.config || { echo "!! ${k} 非 =y"; grep -E "^(# )?${k}=" ${{ env.KERNEL_OUT }}/.config || true; exit 1; }
          done
          for k in CONFIG_DEBUG_FS CONFIG_PAGE_OWNER; do
            grep -q "^# ${k} is not set" ${{ env.KERNEL_OUT }}/.config || { echo "!! ${k} 应关闭"; exit 1; }
          done
          # LOCALVERSION 断言: official = 官方机制 (AUTO=y + LOCALVERSION=-qgki);
          # ksu = 写死官方版本串 (AUTO 关, 避免 -dirty 混入 vermagic)
          if [ "$MODE" = "official" ]; then
            grep -q '^CONFIG_LOCALVERSION="-qgki"$' ${{ env.KERNEL_OUT }}/.config || { echo "!! LOCALVERSION 异常"; exit 1; }
            grep -q '^CONFIG_LOCALVERSION_AUTO=y$' ${{ env.KERNEL_OUT }}/.config || { echo "!! LOCALVERSION_AUTO 应为 y (官方同款版本串机制)"; exit 1; }
          else
            grep -q '^CONFIG_LOCALVERSION="-qgki-g84e7d691ee3a"$' ${{ env.KERNEL_OUT }}/.config || { echo "!! ksu LOCALVERSION 未写死官方串"; exit 1; }
            grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' ${{ env.KERNEL_OUT }}/.config || { echo "!! ksu 模式 LOCALVERSION_AUTO 应为关 (防 -dirty)"; exit 1; }
          fi
          # ★ ksu 模式 (E2): KSU + SUSFS 全部开关必须已生效
          if [ "$MODE" = "ksu" ]; then
            for k in CONFIG_KSU \
              CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP; do
              grep -q "^${k}=y" ${{ env.KERNEL_OUT }}/.config || { echo "!! ${k} 非 =y (KSU Kconfig 未生效?)"; grep -E "^(# )?${k}=" ${{ env.KERNEL_OUT }}/.config || true; exit 1; }
            done
            # Hook 方法单选: KSU_TRACEPOINT_HOOK/KSU_MANUAL_HOOK 必须不选 (走 SUSFS)
            if grep -qE "^CONFIG_KSU_(TRACEPOINT_HOOK|MANUAL_HOOK)=y" ${{ env.KERNEL_OUT }}/.config; then
              echo "!! 意外: TRACEPOINT/MANUAL_HOOK 被选中 (应走 SUSFS)"; exit 1
            fi
            echo "OK: KSU + SUSFS 全开关生效 (E2)"
          fi
          echo "OK: 与官方 config 关键项一致 (LTO/CFI/LLD/RELR/COMPAT_VDSO/存储加密全解锁)"
          grep -E "CONFIG_LTO_CLANG|CONFIG_THINLTO|CONFIG_CFI_CLANG|CONFIG_LD_IS_LLD|CONFIG_RELR|CONFIG_COMPAT_VDSO|CONFIG_LOCALVERSION" ${{ env.KERNEL_OUT }}/.config
          cp ${{ env.KERNEL_OUT }}/.config ../kernel_config.txt

      - name: 恢复 ccache (E2/KSU 迭代加速, key 区分 mode)
        id: cache-ccache
        if: env.MODE == 'ksu'
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-${{ github.event.inputs.kernel_branch }}-${{ env.MODE }}-${{ github.run_id }}
          restore-keys: |
            ccache-oscar-${{ github.event.inputs.kernel_branch }}-${{ env.MODE }}-

      - name: 编译内核 (clang21 + LTO + CFI + LLD)
        run: |
          cd kernel
          export PATH=$PWD/../clang-prebuilts/${{ env.CLANG_VER }}/bin:$PATH
          # E2: rc1 kernel_compat.mk 自动检测 5.4 树并注入所需 ccflags
          #   (KSU_COMPAT_HAS_SELINUX_STATE / KSU_COMPAT_USE_SELINUX_STATE /
          #    OPTIONAL_SECCOMP_FILTER_RELEASE 等), 无需手动 KCFLAGS 宏。
          KFLAGS_LSU=""
          MAKE_CC="clang"
          if [ "$MODE" = "ksu" ]; then
            export CCACHE_DIR=$HOME/.ccache
            ccache -M 2G
            MAKE_CC="ccache clang"
          fi
          make O=${{ env.KERNEL_OUT }} ARCH=arm64 \
            CC="$MAKE_CC" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy STRIP=llvm-strip AR=llvm-ar LLVM_IAS=1 \
            KCFLAGS="-I. -Idrivers/usb/typec/tcpc$KFLAGS_LSU" -j$(nproc)
          ls -la ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image ${{ env.KERNEL_OUT }}/vmlinux
          echo "--- 内核版本 (期 5.4.302-qgki-g84e7d691ee3a, clang21, +lto) ---"
          strings -a ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image | grep -m1 "Linux version"
          strings -a ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image | grep -m1 "clang version 21"

      - name: 下载官方 boot.img (los_date, 校验 sha256)
        run: |
          set -e
          EXPECT_SHA=""
          if curl -s --max-time 20 "https://download.lineageos.org/api/v2/devices/${DEVICE}/builds" -o los_builds.json; then
            EXPECT_SHA=$(python3 -c "
          import json
          d = json.load(open('los_builds.json'))
          date = '${{ github.event.inputs.los_date }}'
          for b in d:
              if b.get('date','').replace('-','') == date:
                  for f in b.get('files',[]):
                      if f.get('filename') == 'boot.img':
                          print(f.get('sha256',''))
          ")
            rm -f los_builds.json
            echo "官方 API 返回 boot.img sha256: $EXPECT_SHA"
          else
            echo "官方 API 不可用, 跳过 sha256 校验"
          fi
          for BOOT_URL in \
            "https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img" \
            "https://mirror.freedif.org/lineageos/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img"; do
            echo "尝试直链: $BOOT_URL"
            HTTP=$(curl -sL -o boot.img -w '%{http_code}' --retry 3 "$BOOT_URL" || echo 000)
            if [ "$HTTP" = "200" ] && [ -s boot.img ]; then
              echo "直链下载成功: $(stat -c%s boot.img) bytes"
              break
            fi
            rm -f boot.img
          done
          if [ -s boot.img ]; then
            echo "boot.img 就绪 (直链)"
          else
            echo "直链均不可用, 改用 payload.bin 提取"
            LOS_URL="https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/lineage-${{ github.event.inputs.los_version }}-${{ github.event.inputs.los_date }}-nightly-${DEVICE}-signed.zip"
            curl -sL --retry 3 -o los.zip "$LOS_URL"
            unzip -o los.zip payload.bin
            rm -f los.zip
            PDG_URL=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if 'linux_amd64' in a['name']][0])")
            curl -sL -o pdg.tar.gz "$PDG_URL"
            tar -xzf pdg.tar.gz
            rm -f pdg.tar.gz
            ./payload-dumper-go -o . -p boot payload.bin
            rm -f payload.bin
          fi
          python3 -c "
          with open('boot.img','rb') as f:
              assert f.read(8) == b'ANDROID!', 'boot.img magic 校验失败'
          print('boot.img magic OK')
          "
          if [ -n "$EXPECT_SHA" ]; then
            ACTUAL_SHA=$(sha256sum boot.img | cut -d' ' -f1)
            echo "实际 sha256: $ACTUAL_SHA"
            [ "$ACTUAL_SHA" = "$EXPECT_SHA" ] || { echo "!! sha256 不匹配"; exit 1; }
            echo "sha256 校验通过"
          fi
          echo "原版 boot.img 就绪: $(stat -c%s boot.img) bytes"

      - name: 解包原 boot + 打包 new boot (官方参数, 强制 v3)
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --out boot_split
          ls boot_split/
          # ★ header_version 必须 =3: ABL 只接受 v3 头 (设备实测: v4头 -> init_user0_failed -> recovery)
          # 官方工具 --format mkbootimg -0 读回权威参数 (unpack 不落 header_version 文件, 不能 cat fallback)
          BOOT_ARGS=$(python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --format mkbootimg -0 2>/dev/null | tr '\0' '\n')
          HDR_VER=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--header_version$' | tail -1)
          OS_VER=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--os_version$' | tail -1)
          OS_PATCH=$(printf '%s\n' "$BOOT_ARGS" | grep -A1 '^--os_patch_level$' | tail -1)
          [ -n "$HDR_VER" ] || HDR_VER=3
          if [ "$HDR_VER" != "3" ]; then
            echo "!! 官方 header_version=$HDR_VER 非 3, 强制 3 (ABL 只接受 v3)"
            HDR_VER=3
          fi
          [ -n "$OS_VER" ]   || OS_VER=16.0.0
          [ -n "$OS_PATCH" ] || OS_PATCH=2026-09
          echo "os_version=$OS_VER os_patch=$OS_PATCH header=$HDR_VER (≥v3 断言通过)"
          echo "官方内核大小: $(stat -c%s boot_split/kernel)"
          echo "D0 内核大小:   $(stat -c%s kernel/${{ env.KERNEL_OUT }}/arch/arm64/boot/Image)"
          python3 mkbootimg/mkbootimg.py \
            --kernel kernel/${{ env.KERNEL_OUT }}/arch/arm64/boot/Image \
            --ramdisk boot_split/ramdisk \
            --cmdline "$(cat boot_split/cmdline 2>/dev/null)" \
            --header_version $HDR_VER \
            --os_version "$OS_VER" --os_patch_level "$OS_PATCH" \
            -o new_boot.img
          ls -la new_boot.img

      - name: 验证产物 (官方工具链串 + KSU 符号断言 + sha256)
        run: |
          # ★ 新 boot 必须为 header_version=3, 否则 ABL 不启动
          NEW_HDR=$(python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --format mkbootimg -0 2>/dev/null | tr '\0' '\n' | grep -A1 '^--header_version$' | tail -1)
          echo "new_boot header_version=$NEW_HDR"
          [ "$NEW_HDR" = "3" ] || { echo "!! new_boot.img header_version=$NEW_HDR != 3 (ABL 只接受 v3), 终止"; exit 1; }
          python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --out new_split
          echo "新 boot 内核大小: $(stat -c%s new_split/kernel)"
          echo "官方 boot 内核大小 (对照): $(stat -c%s boot_split/kernel)"
          echo "--- 内核版本串 (应 5.4.302-qgki-g84e7d691ee3a) ---"
          strings -a new_split/kernel | grep -m1 "Linux version"
          echo "--- clang 版本串 (必须 21 且含官方 +pgo,+bolt,+lto,+mlgo) ---"
          VER=$(strings -a new_split/kernel | grep -m1 "clang version 21")
          echo "$VER"
          echo "$VER" | grep -q "based on r563880c" || { echo "!! 非官方 r563880c prebuilt"; exit 1; }
          echo "--- LTO/CFI 特征 (CONFIG_CC_VERSION_TEXT 带 +lto) ---"
          strings -a new_split/kernel | grep -m1 "+pgo, +bolt, +lto, +mlgo" || { echo "!! 未见 +lto 特征"; exit 1; }
          echo "--- 官方 Image 对照 (boot_split/kernel 应含相同串) ---"
          strings -a boot_split/kernel | grep -m1 "Linux version"
          strings -a boot_split/kernel | grep -m1 "clang version 21"
          echo "--- KSU + SUSFS 符号断言 (E2 = KSU+SUSFS 完整) ---"
          if [ "$MODE" = "ksu" ]; then
            # E2: 官方配方 + KSU + SUSFS -> 必须有 KSU 痕迹, 且必须检测到 SUSFS 符号
            KSU_HIT=0
            SUSFS_NM=0
            if [ -f kernel/${{ env.KERNEL_OUT }}/vmlinux ]; then
              KSU_HIT=$($PWD/clang-prebuilts/${{ env.CLANG_VER }}/bin/llvm-nm kernel/${{ env.KERNEL_OUT }}/vmlinux 2>/dev/null | grep -icE "kernelsu|ksud|ksu_init|ksu_core" || true)
              echo "vmlinux 符号表 KSU 匹配: $KSU_HIT"
              # SUSFS 符号: vmlinux 符号表搜 susfs_inode/susfs_rename/susp_ 等 (fs/susfs.c 编入才有)
              SUSFS_NM=$($PWD/clang-prebuilts/${{ env.CLANG_VER }}/bin/llvm-nm kernel/${{ env.KERNEL_OUT }}/vmlinux 2>/dev/null | grep -icE "susfs|susp_" || true)
              echo "vmlinux 符号表 SUSFS 匹配: $SUSFS_NM"
            fi
            STR_HIT=$(strings -a new_split/kernel | grep -icE "kernelsu|ksud|/data/adb|KernelSU" || true)
            echo "kernel Image KSU 字符串匹配: $STR_HIT"
            SUSFS_STR=$(strings -a new_split/kernel | grep -icE "susfs|SUSFS" || true)
            echo "kernel Image SUSFS 字符串匹配: $SUSFS_STR"
            [ "$STR_HIT" -gt 0 ] || { echo "!! ksu 模式未检测到 KSU 符号"; exit 1; }
            [ "$SUSFS_NM" -gt 0 ] || [ "$SUSFS_STR" -gt 0 ] || { echo "!! E2 未检测到 SUSFS 符号 (fs/susfs.c 未编入?)"; exit 1; }
            echo "OK: KSU + SUSFS 已集成到官方配方内核 (E2)"
          else
            # D0: 必须无 KSU/SUSFS
            if [ -f kernel/${{ env.KERNEL_OUT }}/vmlinux ]; then
              if $PWD/clang-prebuilts/${{ env.CLANG_VER }}/bin/llvm-nm kernel/${{ env.KERNEL_OUT }}/vmlinux 2>/dev/null | grep -icE "ksu_|ksud|kernelsu|susfs" | grep -qE "^0$"; then
                echo "OK: vmlinux 符号表无 KSU/SUSFS"
              else
                echo "!! vmlinux 检测到 KSU/SUSFS 符号"; exit 1
              fi
            fi
            if strings -a new_split/kernel | grep -qicE "kernelsu|ksud|susfs|KSU_"; then
              echo "!! kernel Image 发现 KSU/SUSFS 字符串 (D0 应无)"; exit 1
            fi
            echo "OK: 无 KSU/SUSFS 痕迹"
          fi
          sha256sum new_boot.img > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 保存 ccache (E2/KSU 构建成功才更新, 供下次迭代加速)
        if: env.MODE == 'ksu'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-${{ github.event.inputs.kernel_branch }}-${{ env.MODE }}-${{ github.run_id }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODE == 'ksu' && 'resukisu-susfs' || 'd0-baseline-official-boot' }}
          path: |
            new_boot.img
            SHA256SUMS.txt
            kernel_config.txt
            kernel/${{ env.KERNEL_OUT }}/arch/arm64/boot/Image
          if-no-files-found: error